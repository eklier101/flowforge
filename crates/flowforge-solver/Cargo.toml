[package]
name = "flowforge-solver"
version = "0.1.0"
edition = "2021"
description = "FlowForge auto-schedule placement engine (JSON stdin/stdout)"

[[bin]]
name = "flowforge-solver"
path = "src/main.rs"

[dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
chrono = { version = "0.4", default-features = false, features = ["std", "clock"] }

[profile.release]
lto = true
codegen-units = 1
panic = "abort"
