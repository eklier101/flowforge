name: Build

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Go
        uses: actions/setup-go@v5
        with:
          go-version: "1.23"

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Build web UI
        run: npm run build -w web

      - name: Build Go binary
        run: go build -o flowforge ./cmd/flowforge

      - name: Vet Go packages
        # Scoped to real package trees: the production image file is named
        # Dockerfile.go, so it sits in the module root and `./...` tries to
        # parse it as Go source ("expected 'package', found FROM").
        run: go vet ./cmd/... ./internal/...

      - name: Go tests
        run: go test ./cmd/... ./internal/...

      - name: Mobile typecheck
        working-directory: mobile
        run: npx tsc --noEmit -p tsconfig.json
