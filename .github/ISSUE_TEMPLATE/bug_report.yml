name: Bug report
description: Report a bug or unexpected behavior
title: "[Bug]: "
labels: ["bug"]
body:
  - type: dropdown
    id: platform
    attributes:
      label: Platform
      description: Where did you see the problem?
      options:
        - Web
        - Mobile (Android)
        - API / backend
        - Docker / self-host
        - Other
    validations:
      required: true
  - type: input
    id: version
    attributes:
      label: Version
      description: App version from Settings /api/app (e.g. 3.0.1)
      placeholder: "3.0.1"
    validations:
      required: false
  - type: textarea
    id: what-happened
    attributes:
      label: What happened?
      description: Clear description of the bug
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: Steps to reproduce
      description: Minimal steps another person can follow
      placeholder: |
        1. ...
        2. ...
        3. ...
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: Expected behavior
    validations:
      required: true
  - type: textarea
    id: actual
    attributes:
      label: Actual behavior
    validations:
      required: true
  - type: textarea
    id: logs
    attributes:
      label: Logs / screenshots
      description: Paste relevant API errors, browser console, or describe screenshots
    validations:
      required: false
